[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hesiva"
version = "0.1.0"
description = "Local-first desktop customer account application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "argon2-cffi",
    "PySide6",
    "SQLAlchemy>=2.0,<3.0",
]

[project.scripts]
hesiva = "hesiva.application:main"

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.11,<7",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
